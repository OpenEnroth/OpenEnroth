name: Style

on:
  pull_request: null
  push: null
  workflow_dispatch:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string
  release:
    types:
      - published

# A new push into a PR auto-cancels the run for the previous one. Master and nightly unaffected.
concurrency:
  group: style-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  LLS_TAG: '3.9.1'

jobs:
  check_style:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
          ref: '${{inputs.myCommit}}'

      # OE builds with lld and with mold, and configure step fails if one is not found. We don't need the linker for
      # the style checks, but it's easier to just install it than work this around in CMakeLists.
      - name: Install mold
        uses: rui314/setup-mold@v1
        with:
          mold-version: 2.36.0
          make-default: false

      - name: Restore cached lua-language-server
        id: lls-cache
        uses: actions/cache@v4
        with:
          path: 'lua-language-server/build/bin'
          key: 'lls-cache-${{env.LLS_TAG}}'

      - name: Checkout lua-language-server
        if: steps.lls-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v3
        with:
          repository: 'LuaLS/lua-language-server'
          path: 'lua-language-server'
          ref: '3.9.1'

      - name: Install ninja-build
        if: steps.lls-cache.outputs.cache-hit != 'true'
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Build lua-language-server
        if: steps.lls-cache.outputs.cache-hit != 'true'
        working-directory: lua-language-server
        run: |
          ./make.sh

      - name: Configure
        run: |
          cmake -B build -DOE_USE_DUMMY_DEPENDENCIES=ON -DOE_LLS_COMMAND=./lua-language-server/build/bin/lua-language-server

      - name: Check style
        working-directory: build
        run: |
          make check_style

  check_tidy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
          ref: '${{inputs.myCommit}}'

      - name: Install mold
        uses: rui314/setup-mold@v1
        with:
          mold-version: 2.36.0
          make-default: false

      - name: Install ninja-build
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Install clang-tidy
        run: |
          pip install --break-system-packages clang-tidy==22.1.8

      - name: Configure
        run: |
          cmake -B build -G Ninja

      - name: Run clang-tidy
        working-directory: build
        run: |
          ninja check_tidy
