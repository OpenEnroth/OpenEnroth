name: Style

on:
  pull_request: null
  push: null
  workflow_dispatch:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string
  release:
    types:
      - published

# A new push into a PR auto-cancels the run for the previous one. Master and nightly unaffected.
concurrency:
  group: style-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  LLS_TAG: '3.19.1'

jobs:
  check_style:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
          ref: '${{inputs.myCommit}}'

      # OE builds with lld and with mold, and configure step fails if one is not found. We don't need the linker for
      # the style checks, but it's easier to just install it than work this around in CMakeLists.
      - name: Install mold
        uses: rui314/setup-mold@v1
        with:
          mold-version: 2.36.0
          make-default: false

      # Unpacked outside the workspace on purpose. Inside it, lua-language-server lints its own lua sources.
      - name: Install lua-language-server
        run: |
          mkdir -p "$HOME/lua-language-server"
          curl -fsSL -o "$RUNNER_TEMP/lls.tar.gz" "https://github.com/LuaLS/lua-language-server/releases/download/$LLS_TAG/lua-language-server-$LLS_TAG-linux-x64.tar.gz"
          tar xzf "$RUNNER_TEMP/lls.tar.gz" -C "$HOME/lua-language-server"

      - name: Configure
        run: |
          cmake -B build -DOE_USE_DUMMY_DEPENDENCIES=ON -DOE_LLS_COMMAND="$HOME/lua-language-server/bin/lua-language-server"

      - name: Check style
        working-directory: build
        run: |
          make check_style
