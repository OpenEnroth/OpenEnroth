name: Style

on:
  pull_request: null
  push: null
  workflow_dispatch:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string
  release:
    types:
      - published

# A new push into a PR auto-cancels the run for the previous one. Master and nightly unaffected.
concurrency:
  group: style-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check_style:
    runs-on: ubuntu-26.04
    steps:
      # No submodules: bazel pins cpplint and lua-language-server itself.
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          ref: '${{inputs.myCommit}}'

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true

      - name: Configure remote cache
        run: |
          key='${{secrets.BUILDBUDDY_API_KEY}}'
          if [ -n "$key" ]; then
            echo "BAZEL_REMOTE_ARGS=--config=remote-cache --remote_header=x-buildbuddy-api-key=$key" >> "$GITHUB_ENV"
          else
            # No secrets (untrusted fork PR): read the cache with the public key.
            echo "BAZEL_REMOTE_ARGS=--config=remote-cache-read" >> "$GITHUB_ENV"
          fi

      # Reuse the linux_x86_64 matrix leg's caches - same lint action keys.
      - name: Restore bazel caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-style-${{github.run_id}}
          restore-keys: |
            bazel-linux_x86_64-

      - name: Check style
        run: |
          bazel build -c dbg ${{env.BAZEL_REMOTE_ARGS}} //:check_style
