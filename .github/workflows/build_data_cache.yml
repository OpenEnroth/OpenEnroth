name: Populate Data Cache

on:
  schedule:
    # schedule build hourly
    - cron: '16 * * * *'
  workflow_dispatch: # Allow to manually run a workflow

defaults:
  run:
    shell: bash

jobs:
  build_data_cache:
    timeout-minutes: 60
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        architecture: [x64]
    steps:
      - name: 'Check for data cache'
        id: check_for_data_cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            OpenEnroth_GameData
          key: data-cache
          lookup-only: true

      - name: 'Checkout private data'
        if: steps.check_for_data_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: OpenEnroth/OpenEnroth_GameData
          path: OpenEnroth_GameData
          lfs: true # .vid files are stored in LFS.
          token: ${{secrets.DATA_ACCESS_TOKEN}}
          persist-credentials: false # Keeps the data repo token out of this tree, which gets cached and restored in pull request runs.

      # Pull request runs restore this cache, and they only need the data files.
      - name: 'Drop git metadata'
        if: steps.check_for_data_cache.outputs.cache-hit != 'true'
        run: |
          rm -rf OpenEnroth_GameData/.git

      - name: 'Cache data'
        if: steps.check_for_data_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            OpenEnroth_GameData
          key: data-cache
