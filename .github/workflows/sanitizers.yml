name: Sanitizers

on:
  pull_request: null
  # Runs on master are what populates the ccache, PR runs are never allowed to save it.
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string

# A new push into a PR auto-cancels the run for the previous one. Master runs get a unique group and never cancel.
concurrency:
  group: sanitizers-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Luajit builds minilua and buildvm and runs them during the build, and both leak by design, so
  # LeakSanitizer would fail the build long before it reaches our code. Many of our own game tests
  # leak too, so LSan needs its own cleanup pass before it can be turned on.
  ASAN_OPTIONS: detect_leaks=0

jobs:
  asan:
    timeout-minutes: 120
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: 'Configure fast APT mirror'
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: 'Checkout'
        uses: actions/checkout@v5.0.0
        with:
          submodules: recursive
          ref: '${{inputs.myCommit}}'

      - name: 'Install dependencies'
        uses: Wandalen/wretry.action@master
        with:
          attempt_limit: 3
          attempt_delay: 5000
          command: |
            sudo apt-get update
            sudo apt-get install -y lld libglu1-mesa-dev

      - name: 'Restore data cache'
        uses: actions/cache/restore@v4.2.4
        with:
          path: |
            OpenEnroth_GameData
          key: data-cache

      - name: 'Run ccache'
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: 'linux-asan-x86_64'
          verbose: 2
          max-size: 400M
          save: ${{github.event_name != 'pull_request'}}

      - name: 'Configure'
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DOE_USE_SANITIZERS=address

      - name: 'Build'
        working-directory: build
        run: |
          ninja

      - name: 'Run unit tests'
        working-directory: build
        run: |
          ninja Run_UnitTest

      - name: 'Run game tests'
        working-directory: build
        run: |
          ninja Run_GameTest_Headless_Parallel
        env:
          OPENENROTH_MM7_PATH: ${{github.workspace}}/OpenEnroth_GameData/mm7
