# TEMPORARY diagnostic workflow for task #22 - delete once the luajit x86 crash
# is understood. Reproduces the opt-mode engine init segfault on 32-bit x86
# under gdb and dumps the ELF layout, in one small job instead of a matrix leg.
name: Debug LuaJIT x86

on:
  push:
    branches:
      - feature/bazel-migration

jobs:
  luajit_x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v5.0.0

      - name: 'Install dependencies'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-14-multilib g++-14-multilib lld gdb
          sudo apt-get install -y libglu1-mesa-dev:i386 libdwarf-dev:i386 libelf-dev:i386
          sudo apt-get install -y libx11-dev:i386 libxext-dev:i386 libxrandr-dev:i386 \
            libxcursor-dev:i386 libxi-dev:i386 libxfixes-dev:i386 \
            libwayland-dev:i386 libxkbcommon-dev:i386
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: 'Set up Bazel'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-version: 1.x
          bazelisk-cache: true

      - name: 'Restore game data cache'
        uses: actions/cache/restore@v4.2.4
        with:
          path: OpenEnroth_GameData
          key: data-cache

      - name: 'Build the faulting configuration'
        run: |
          bazel build -c opt --config=linux_x86 --config=remote-cache-read \
            //test/Bin/GameTest:OpenEnroth_GameTest

      - name: 'Dump ELF layout'
        run: |
          set -x
          bin=bazel-bin/test/Bin/GameTest/OpenEnroth_GameTest
          file "$bin"
          echo "==== program headers (GNU_STACK perms matter)"
          readelf -lW "$bin" | head -40
          echo "==== lj_vm symbol addresses"
          nm "$bin" 2>/dev/null | grep -i " lj_vm" | head -10 || true
          echo "==== generated lj_vm objects and their stack note"
          find -L bazel-out bazel-workspace/external 2>/dev/null -name "lj_vm*" | head -5 || true
          for o in $(find -L bazel-out -name "*lj_vm*.o" -o -name "*lj_vm*.pic.o" 2>/dev/null | head -2); do
            echo "---- $o"
            readelf -SW "$o" | grep -iE "Name|text|note|W.*X|AX" || true
          done

      - name: 'Reproduce under gdb'
        run: |
          if [ ! -d OpenEnroth_GameData ]; then echo "::warning::no game data cache"; exit 0; fi
          bin=$PWD/bazel-bin/test/Bin/GameTest/OpenEnroth_GameTest
          export OPENENROTH_MM7_PATH=$PWD/OpenEnroth_GameData/mm7
          gdb -batch \
            -ex 'set pagination off' -ex 'set confirm off' \
            -ex run \
            -ex 'echo \n==== registers\n' -ex 'info registers' \
            -ex 'echo \n==== code at pc\n' -ex 'x/6i $pc' \
            -ex 'echo \n==== backtrace\n' -ex 'bt 25' \
            -ex 'echo \n==== all threads\n' -ex 'thread apply all bt 6' \
            -ex 'echo \n==== mappings\n' -ex 'info proc mappings' \
            --args "$bin" --test-path "$PWD/test/Data" --gtest_filter=Prs.Pr1005 2>&1 | tail -150
