name: Linux (Flatpak)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string
      releaseTag:
        description: Release tag
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string
      releaseTag:
        description: Release tag
        required: false
        default: ''
        type: string

# A new push into a PR auto-cancels the run for the previous one. Master and nightly unaffected.
# Build Release runs this workflow and build_all inside its own run, where both see Build Release's name and run_id,
# so only a literal prefix ("linux-flatpak-") keeps their concurrency groups apart.
concurrency:
  group: linux-flatpak-${{github.event.pull_request.number || github.run_id}}
  cancel-in-progress: true

env:
  CCACHE_COMPILERCHECK: content

defaults:
  run:
    shell: bash

jobs:
  build_flatpak_bundle:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - RelWithDebInfo
        architecture:
          - x86_64
    env:
      # An empty release tag must not leave a doubled underscore in the file name.
      RELEASE_FILE: OpenEnroth_Linux${{inputs.releaseTag && format('_{0}', inputs.releaseTag) || ''}}_${{matrix.configuration}}_${{matrix.architecture}}.flatpak
    steps:
      - name: 'Make ccache dir'
        run: |
          mkdir -p .ccache
          cd .ccache
          echo "CCACHE_DIR=$PWD" >> "$GITHUB_ENV"

      - name: 'Checkout'
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          ref: ${{inputs.myCommit}}

      - name: 'Set up ccache'
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux-flatpak-${{matrix.configuration}}-${{matrix.architecture}}
          verbose: 2
          max-size: 400M
          save: ${{github.event_name != 'pull_request'}}

      - name: 'Run Flatpak build'
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          run-tests: true
          bundle: ${{env.RELEASE_FILE}}
          manifest-path: distribution/linux/flatpak/dev.io.github.openenroth.openenroth.yml
          arch: ${{matrix.architecture}}
          verbose: true
          cache: true
          restore-cache: false
          upload-artifact: false

      - name: 'Publish release'
        if: inputs.releaseTag != ''
        uses: softprops/action-gh-release@v3.0.3
        with:
          prerelease: true
          tag_name: ${{inputs.releaseTag}}
          files: ${{env.RELEASE_FILE}}
          fail_on_unmatched_files: true

      - name: 'Clean up ccache'
        run: |
          ccache -c
