name: Linux (Flatpak)

on:
  pull_request: null
  workflow_dispatch:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string
      releaseTag:
        description: Release tag
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string
      releaseTag:
        description: Release tag
        required: false
        default: ''
        type: string
  release:
    types:
      - published

# A new push into a PR auto-cancels the run for the previous one. Everything else lands in a group of one, so master
# and nightly builds never queue behind or cancel each other. The group name starts with a literal because
# `github.run_id` is the caller's id inside a reusable workflow, and the workflows called from the nightly build must
# not end up sharing a group.
concurrency:
  group: linux-flatpak-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CCACHE_COMPILERCHECK: content
    
jobs:
  build_flatpak_bundle:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - RelWithDebInfo
        architecture:
          - x86_64

    steps:
    - name: make ccache dir
      run: |
        mkdir -p .ccache
        cd .ccache
        echo "CCACHE_DIR=$PWD" >> $GITHUB_ENV
        
    - name: Checkout
      uses: actions/checkout@v5.0.0
      with:
        submodules: recursive
        ref: '${{inputs.myCommit}}'
          
    - name: Run ccache
      uses: hendrikmuhs/ccache-action@v1.2.18
      with:
        key: 'linux-flatpak-${{matrix.configuration}}-${{matrix.architecture}}'
        verbose: 2
        max-size: 400M
        save: ${{github.event_name != 'pull_request'}}
        
    - name: Run Flatpak build
      uses: flatpak/flatpak-github-actions/flatpak-builder@dcbd3a30d991a38708c318d17f5352cc1268c215
      with:
        run-tests: true
        bundle: io.github.openenroth.openenroth_${{inputs.releaseTag}}_${{matrix.configuration}}_${{matrix.architecture}}.flatpak
        manifest-path: distribution/linux/flatpak/dev.io.github.openenroth.openenroth.yml
        arch: ${{matrix.architecture}}
        verbose: true
        cache: true
        restore-cache: false
        upload-artifact: false

    - name: Publish release
      if: inputs.releaseTag != ''
      uses: softprops/action-gh-release@v2.0.8
      with:
        prerelease: true
        tag_name: '${{inputs.releaseTag}}'
        files: io.github.openenroth.openenroth_${{inputs.releaseTag}}_${{matrix.configuration}}_${{matrix.architecture}}.flatpak

    - name: Cleanup ccache
      run: |
        ccache -c
