name: Doxygen

on:
  pull_request: null
  push: null
  workflow_dispatch:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string
  release:
    types:
      - published

# A new push into a PR auto-cancels the run for the previous one. Everything else lands in a group of one, so master
# builds never queue behind or cancel each other.
concurrency:
  group: doxygen-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generate_documentation:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: '${{ inputs.myCommit }}'

      - name: Install Doxygen
        run: |
          curl -fsSL --retry 3 -o doxygen.tar.gz https://github.com/doxygen/doxygen/releases/download/Release_1_9_5/doxygen-1.9.5.linux.bin.tar.gz
          tar xzf doxygen.tar.gz --strip-components=2 doxygen-1.9.5/bin/doxygen -C .

      - name: Generate Documentation
        run: |
          export PROJECT_NUMBER="$(git describe --always --tags --dirty)"
          ./doxygen Doxyfile
          touch docs/html/.nojekyll

