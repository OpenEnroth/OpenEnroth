name: Doxygen

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string

# A new push into a PR auto-cancels the run for the previous one. Master and nightly unaffected.
concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number || github.run_id}}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  generate_documentation:
    timeout-minutes: 60
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          ref: '${{inputs.myCommit}}'

      - name: Install Doxygen
        run: |
          curl -fsSL --retry 3 -o doxygen.tar.gz https://github.com/doxygen/doxygen/releases/download/Release_1_9_5/doxygen-1.9.5.linux.bin.tar.gz
          tar xzf doxygen.tar.gz --strip-components=2 doxygen-1.9.5/bin/doxygen -C .

      # The generated html goes nowhere. This runs for the warnings, which the Doxyfile turns into errors.
      - name: Generate documentation
        run: |
          ./doxygen Doxyfile
