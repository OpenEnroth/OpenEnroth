name: Shaders

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      myCommit:
        description: Commit SHA1
        required: false
        default: ''
        type: string

# A new push into a PR auto-cancels the run for the previous one. Master and nightly unaffected.
concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number || github.run_id}}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check_shaders:
    timeout-minutes: 60
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          ref: '${{inputs.myCommit}}'

      - name: Install dependencies
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          attempt_delay: 5000
          command: |
            sudo apt-get update
            sudo apt-get install -y glslang-tools

      - name: Check shaders
        run: |
          for glsl_version in "410 core" "320 es"; do
            for shader in resources/shaders/*.vert resources/shaders/*.frag; do
              echo "Checking $shader against GLSL $glsl_version..."
              ./scripts/check_shader.sh "$shader" "$glsl_version"
            done
          done
