app-id: io.github.openenroth.openenroth
runtime: org.freedesktop.Platform
runtime-version: &runtime-version '24.08'
sdk: org.freedesktop.Sdk
command: io.github.openenroth.openenroth.sh

build-options:
  build-args:
    - --share=network

finish-args:
  # hardware 3D and controller access
  - --device=all
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Audio
  - --socket=pulseaudio

modules:

  - name: openenroth
    buildsystem: simple
    build-options:
      strip: false  # Do not strip binaries to keep debug symbols.
      no-debuginfo: false  # Ensure debug info is generated.
    build-commands:
      # The dev manifest builds with --share=network, so bazel fetches deps
      # itself. One command: every build-command gets a fresh sandbox, so all
      # state stays in the build dir. Output tees there too for CI.
      # TODO(captainurist): would be cool to run game tests here too!
      - |
        set -eo pipefail
        curl -sL https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -o ./bazelisk
        chmod +x ./bazelisk
        export HOME=$PWD/.home
        mkdir -p "$HOME"
        ./bazelisk build -c opt //src/Bin/OpenEnroth:OpenEnroth 2>&1 | tee bazel-build.log
        ./bazelisk test -c opt --test_output=errors //test/Bin/UnitTest:OpenEnroth_UnitTest 2>&1 | tee bazel-test.log
    sources:
      - type: dir
        path: ../../../
    post-install:
      - install -Dm755 bazel-bin/src/Bin/OpenEnroth/OpenEnroth /app/bin/OpenEnroth
      # launcher script
      - install -Dm755 distribution/linux/flatpak/${FLATPAK_ID}.sh /app/bin/${FLATPAK_ID}.sh
      # Icon
      - install -Dm644 distribution/linux/${FLATPAK_ID}.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      # metainfo
      - install -Dm644 distribution/linux/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 distribution/linux/${FLATPAK_ID}.releases.xml /app/share/releases/${FLATPAK_ID}.releases.xml
      # desktop file
      - install -Dm644 distribution/linux/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key=Exec --set-value="${FLATPAK_ID}.sh" /app/share/applications/${FLATPAK_ID}.desktop
