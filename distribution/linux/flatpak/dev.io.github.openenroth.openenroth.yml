app-id: io.github.openenroth.openenroth
runtime: org.freedesktop.Platform
runtime-version: &runtime-version '25.08'
sdk: org.freedesktop.Sdk
command: io.github.openenroth.openenroth.sh

build-options:
  build-args:
    - --share=network

finish-args:
  # hardware 3D and controller access
  - --device=all
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Audio
  - --socket=pulseaudio

cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg

sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    add-ld-path: .
    version: *runtime-version
    no-autodownload: false
    autodelete: false

modules:
  - name: sdl3
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL_TESTS=OFF
      - -DSDL_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.2.22/SDL3-3.2.22.tar.gz
        mirror-urls:
          - https://libsdl.org/release/SDL3-3.2.22.tar.gz
        sha256: f29d00cbcee273c0a54f3f32f86bf5c595e8823a96b1d92a145aac40571ebfcc

  - name: openenroth
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      # Both flatpak-builder passes below would remove the symbol table that crash traces need for function names.
      # The post-install runs `strip --strip-debug` instead, which removes only the debug info.
      strip: false  # Would run a plain `strip`, which removes the symbol table along with the debug info.
      no-debuginfo: true  # Would move the debug info and the symbol table to the .Debug extension, which isn't bundled.
    cleanup:
      - /bin/OpenEnroth_UnitTest
      - /share/cmake
      - /lib/cmake
      - /share/man
      - /share/gch
      - '*.a'
      - /include
    config-opts:
      - -DOE_BUILD_TOOLS=OFF
      - -DOE_CHECK_STYLE=OFF
      - -DOE_CHECK_TIDY=OFF
      - -DOE_CHECK_LUA_STYLE=OFF
      - -DOE_USE_PREBUILT_DEPENDENCIES=OFF
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_LINKER=lld
    sources:
      - type: dir
        path: ../../../
    # TODO(captainurist): would be cool to run game tests here too!
    run-tests: true
    test-rule: ''  # Without it flatpak-builder runs "ninja test", and CMake makes no such target here.
    test-commands:
      - OpenEnroth_UnitTest  # The stripped copy from post-install, so the tests see the binary users get.
    post-install:
      - install -Dm755 src/Bin/OpenEnroth/OpenEnroth /app/bin/OpenEnroth
      - install -Dm755 test/Bin/UnitTest/OpenEnroth_UnitTest /app/bin/OpenEnroth_UnitTest
      - strip --strip-debug /app/bin/OpenEnroth /app/bin/OpenEnroth_UnitTest  # Keeps the symbol table for crash traces.
      # launcher script
      - install -Dm755 ../distribution/linux/flatpak/${FLATPAK_ID}.sh /app/bin/${FLATPAK_ID}.sh
      # Icon
      - install -Dm644 ../distribution/linux/${FLATPAK_ID}.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      # metainfo
      - install -Dm644 ../distribution/linux/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 ../distribution/linux/${FLATPAK_ID}.releases.xml /app/share/releases/${FLATPAK_ID}.releases.xml
      # desktop file
      - install -Dm644 ../distribution/linux/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key=Exec --set-value="${FLATPAK_ID}.sh" /app/share/applications/${FLATPAK_ID}.desktop
